name: Corrigir Figura 1 temporariamente

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/corrigir_figura1_temporario.yml

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir balão final e setas curvas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('latex-artigo/sections/03_metodologia.tex')
          text = path.read_text(encoding='utf-8')

          replacements = {
              r'final/.style={draw=black, very thick, rounded corners, align=center, text width=9.2cm, minimum height=10mm, font=\small},':
              r'final/.style={draw=black, very thick, rounded corners, align=center, text width=6.0cm, minimum height=10mm, font=\small},',
              r'\draw[arrow] (p3) |- (f);':
              r'\draw[arrow, rounded corners=2mm] (p3.south) |- (f.west);',
              r'\draw[arrow] (s3) |- (f);':
              r'\draw[arrow, rounded corners=2mm] (s3.south) |- (f.east);',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Trecho não localizado: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Registrar correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latex-artigo/sections/03_metodologia.tex
          git commit -m "Corrige direção e curvatura das setas da Figura 1"
          git push origin main
