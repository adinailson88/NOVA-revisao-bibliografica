name: Calcular interseção dos núcleos

on:
  push:
    branches:
      - agent/revisao-parecer-critico
    paths:
      - "scripts/python/15_calcular_intersecao_nucleos.py"
      - "scripts/python/verificar_artigo_integrado.py"
      - ".github/workflows/intersecao-nucleos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calcular:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/revisao-parecer-critico

      - name: Instalar pandas
        run: python -m pip install --disable-pip-version-check pandas

      - name: Calcular interseção
        run: python scripts/python/15_calcular_intersecao_nucleos.py

      - name: Registrar resultado na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latex-artigo/fontes/intersecao_camadas_372_121.csv
          if git diff --cached --quiet; then
            echo "Resultado inalterado."
          else
            git commit -m "Registra interseção auditável entre as camadas [skip ci]"
            git push
          fi
