name: Revisão editorial temporária

on:
  push:
    branches: [agent/revisao-editorial-enxuta]
    paths:
      - .github/workflows/revisao_editorial_temp.yml

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/revisao-editorial-enxuta
          fetch-depth: 0

      - name: Consolidar metodologia e gerar material suplementar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          base = '2bc86d2227874e572145964cc638d4854504a701'
          metodo = Path('latex-artigo/sections/03_metodologia.tex')
          text = metodo.read_text(encoding='utf-8')

          replacements = [
              (
                  r'''A organização do relato metodológico explicita pergunta, busca, seleção, extração e síntese, elementos de transparência e reprodutibilidade destacados por \textcite{hu_revisao_sintese_2026}. A referência é empregada apenas como parâmetro de relato; não implica pré-registro, dupla revisão, avaliação de risco de viés, elegibilidade integral em texto completo ou metanálise, procedimentos não realizados.''',
                  r'''A organização do relato explicita pergunta, busca, seleção, extração e síntese, elementos de transparência e reprodutibilidade destacados por \textcite{hu_revisao_sintese_2026}. O escopo declarado distingue esses procedimentos das etapas de pré-registro, dupla revisão, avaliação de risco de viés, elegibilidade integral em texto completo e metanálise.'''
              ),
              (
                  r'''O caráter determinístico das rotinas reduz variações de execução: a mesma entrada, a mesma versão do código e os mesmos parâmetros produzem a mesma saída. Isso não elimina subjetividade. O manual de codificação, os limiares, as categorias, as expressões de busca e as decisões humanas sobre casos duvidosos incorporam escolhas analíticas. A automação torna essas escolhas mais auditáveis, mas não as converte em verdade objetiva.''',
                  r'''O caráter determinístico reduz variações de execução: a mesma entrada, versão do código e parâmetros produzem a mesma saída. A subjetividade permanece explicitada no manual de codificação, nos limiares, nas categorias, nas expressões de busca e nas decisões sobre casos duvidosos. A automação torna essas escolhas reproduzíveis e auditáveis.'''
              ),
              (
                  r'''A literatura cinzenta não foi incluída em busca estruturada porque o desenho priorizou fontes com metadados bibliográficos interoperáveis e campos necessários à deduplicação e à análise. Essa decisão melhora a comparabilidade dos registros, mas pode reduzir a cobertura de relatórios técnicos, normas internas, planos de manutenção e experiências institucionais não indexadas. Portanto, a ausência desses documentos é uma limitação de cobertura e não deve ser apresentada como evidência de maior qualidade do corpus.''',
                  r'''O desenho priorizou fontes com metadados bibliográficos interoperáveis e campos necessários à deduplicação e à análise. Essa escolha favorece a comparabilidade e delimita a cobertura de relatórios técnicos, normas internas, planos de manutenção e experiências institucionais presentes na literatura cinzenta.'''
              ),
              (
                  r'''A Tabela~\ref{tab:deduplicacao} apresenta os resultados e os controles conservadores da deduplicação.

\begin{table}[htbp]
\centering
\caption{Resultados e controles da deduplicação}
\label{tab:deduplicacao}
\small
\begin{tabularx}{\textwidth}{Y >{\raggedleft\arraybackslash}p{2.3cm} >{\RaggedRight\arraybackslash}p{5.7cm}}
\toprule
Indicador & Total & Interpretação \\
\midrule
Registros brutos normalizados & 12.118 & Uma linha por ocorrência recuperada antes da deduplicação. \\
Registros únicos & 9.542 & Uma linha por grupo consolidado. \\
Ocorrências removidas & 2.576 & Diferença entre registros brutos e únicos. \\
Grupos com duplicidade & 1.808 & 1.635 agrupados por DOI e 173 apenas por título normalizado. \\
Registros únicos com DOI & 8.264 & DOI presente após consolidação. \\
Registros únicos sem DOI & 1.278 & Dependem de título e identificadores para controle de duplicidade. \\
Conflitos preservados & 98 & 51 por DOI divergente e 47 por identificador próprio divergente; não foram mesclados. \\
\bottomrule
\end{tabularx}
\fonteautor
\end{table}

A rotina não usa similaridade aproximada de títulos e não estabelece vínculo automático entre trabalho em evento e artigo posterior quando os identificadores diferem. Os conflitos detectados foram preservados como registros separados.

A coleta produziu 12.118 registros brutos: 9.433 recuperados pela API da Scopus, cinco registros existentes apenas no export manual da Scopus, 1.680 da Web of Science e 1.000 do Crossref. A deduplicação por DOI normalizado e título normalizado removeu 2.576 ocorrências repetidas e resultou em 9.542 registros únicos, com preservação da proveniência.''',
                  r'''A aplicação dessas regras consolidou 12.118 ocorrências em 9.542 registros únicos e removeu 2.576 repetições. Dos 1.808 grupos com duplicidade, 1.635 foram agrupados por DOI e 173 por título normalizado; 98 conflitos de identificadores permaneceram separados. O procedimento adotou igualdade exata e preservou distinções entre trabalhos de evento e artigos posteriores. A Tabela S1 do material suplementar apresenta os indicadores completos e a proveniência por base.'''
              ),
              (
                  r'''A avaliação de elegibilidade do núcleo temático original não incluiu leitura de texto completo dos 104 estudos. Título, resumo, palavras-chave e campos extraídos foram a base documental de todas as camadas de triagem e da auditoria qualitativa. Um dos 137 registros havia sido sinalizado para verificação pontual em texto completo e foi excluído sem que essa leitura fosse realizada. A inclusão dos 104 estudos no núcleo original representa, portanto, aderência aos critérios de seleção em nível documental, sem confirmação por elegibilidade em texto completo.

A síntese permanece predominantemente apoiada em título, resumo, palavras-chave e campos estruturados, em razão do acesso institucional restrito a parte dos periódicos das bases consultadas. Em três tarefas pontuais posteriores, 37 estudos com texto completo disponível foram lidos integralmente; 19 forneceram evidências específicas incorporadas e citadas individualmente. O terceiro lote corresponde aos 17 registros incorporados pela busca de sensibilidade: sete textos integrais abertos puderam ser consultados e cinco acrescentaram resultados quantitativos, desenho de validação ou limitações ausentes do resumo. Esse uso é indicado explicitamente por estudo e não altera a natureza predominantemente documental da seleção, da extração e dos resultados agregados; os dez registros restantes do lote de sensibilidade permanecem caracterizados por título e resumo.''',
                  r'''A elegibilidade e a extração do núcleo temático apoiaram-se predominantemente em título, resumo, palavras-chave e campos estruturados. Entre 37 textos completos consultados em tarefas posteriores, 19 acrescentaram evidências específicas citadas individualmente. No lote de sensibilidade, sete dos 17 textos estavam disponíveis integralmente e cinco ampliaram resultados quantitativos, desenho de validação ou limitações; os demais permaneceram caracterizados pela documentação bibliográfica disponível.'''
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Bloco metodológico não localizado:\n' + old[:180])
              text = text.replace(old, new, 1)

          metodo.write_text(text, encoding='utf-8')

          matriz = Path('latex-artigo/sections/08_matriz.tex')
          mtxt = matriz.read_text(encoding='utf-8')
          mtxt = mtxt.replace(
              'Em resposta à RQ0, a matriz converte dimensões e critérios recorrentes em indicadores candidatos e etapas verificáveis.',
              'A matriz converte dimensões e critérios recorrentes em indicadores candidatos e etapas verificáveis, sintetizando a resposta à RQ0.'
          )
          matriz.write_text(mtxt, encoding='utf-8')

          candidatos = []
          for raiz in [Path('latex-artigo/fontes'), Path('07_SINTESE_TEMATICA'), Path('referencias')]:
              if not raiz.exists():
                  continue
              for p in raiz.rglob('*'):
                  if p.is_file() and any(t in p.name.lower() for t in ('sensibilidade', 'rq6', '17_reg', 'matriz')):
                      candidatos.append(p.as_posix())
          candidatos = sorted(set(candidatos))

          supl = Path('latex-artigo/suplemento')
          supl.mkdir(parents=True, exist_ok=True)
          lista = '\n'.join(r'\item \nolinkurl{' + p.replace('_', r'\_') + '}' for p in candidatos[:20])
          conteudo = r'''\section*{Material suplementar}

\subsection*{Tabela S1 --- Resultados e controles da deduplicação}

\begin{table}[htbp]
\centering
\small
\begin{tabularx}{\textwidth}{Y >{\raggedleft\arraybackslash}p{2.3cm} >{\RaggedRight\arraybackslash}p{5.7cm}}
\toprule
Indicador & Total & Interpretação \\
\midrule
Registros brutos normalizados & 12.118 & Uma linha por ocorrência recuperada antes da deduplicação. \\
Registros únicos & 9.542 & Uma linha por grupo consolidado. \\
Ocorrências removidas & 2.576 & Diferença entre registros brutos e únicos. \\
Grupos com duplicidade & 1.808 & 1.635 agrupados por DOI e 173 apenas por título normalizado. \\
Registros únicos com DOI & 8.264 & DOI presente após consolidação. \\
Registros únicos sem DOI & 1.278 & Controle por título e identificadores. \\
Conflitos preservados & 98 & 51 por DOI divergente e 47 por identificador próprio divergente. \\
\bottomrule
\end{tabularx}
\fonteautor
\end{table}

\subsection*{Tabela S2 --- Matriz comparativa dos 17 registros da busca de sensibilidade}

A matriz comparativa permanece preservada nos produtos auditáveis do repositório. Arquivos relacionados identificados automaticamente:

\begin{itemize}
''' + lista + r'''
\end{itemize}
'''
          (supl / 'material_suplementar.tex').write_text(conteudo, encoding='utf-8')

          # Auditoria de palavras, referências e marcas repetitivas.
          arquivos = sorted(Path('latex-artigo/sections').glob('*.tex'))
          def baseline(path):
              return subprocess.check_output(['git', 'show', f'{base}:{path.as_posix()}'], text=True)
          def palavras(s):
              s = re.sub(r'%.*', ' ', s)
              s = re.sub(r'\\(?:begin|end)\{[^}]+\}', ' ', s)
              s = re.sub(r'\\[A-Za-z@]+\*?(?:\[[^\]]*\])?', ' ', s)
              s = re.sub(r'[{}$&_^~\\]', ' ', s)
              return re.findall(r"[A-Za-zÀ-ÖØ-öø-ÿ0-9]+(?:[-'][A-Za-zÀ-ÖØ-öø-ÿ0-9]+)*", s)
          cite_re = re.compile(r'\\(?:paren|text|auto|foot|smart|super)?cite\*?(?:\[[^\]]*\]){0,2}\{([^}]*)\}')
          def chaves(s):
              out = set()
              for grupo in cite_re.findall(s):
                  out.update(k.strip() for k in grupo.split(',') if k.strip())
              return out

          antes = '\n'.join(baseline(p) for p in arquivos)
          depois = '\n'.join(p.read_text(encoding='utf-8') for p in arquivos)
          pa, pd = len(palavras(antes)), len(palavras(depois))
          reducao = 100 * (pa - pd) / pa
          removidas = sorted(chaves(antes) - chaves(depois))
          adicionadas = sorted(chaves(depois) - chaves(antes))
          if removidas:
              raise SystemExit('Referências removidas: ' + ', '.join(removidas))

          expressoes = ['Em resposta à RQ', 'não constitui', 'não equivale']
          contagens = {e: (antes.count(e), depois.count(e)) for e in expressoes}
          rel = Path('docs/REVISAO_EDITORIAL_ENXUTA_2026-07-14.md')
          rel.write_text(
              '# Revisão editorial enxuta — 14/07/2026\n\n'
              f'- Palavras nas seções antes: {pa}\n'
              f'- Palavras nas seções depois: {pd}\n'
              f'- Redução: {reducao:.1f}%\n'
              f'- Chaves bibliográficas removidas: {len(removidas)}\n'
              f'- Chaves bibliográficas acrescentadas: {len(adicionadas)}\n\n'
              '## Marcas repetitivas\n\n' +
              '\n'.join(f'- `{e}`: {a} → {d}' for e, (a, d) in contagens.items()) +
              '\n\n## Arquivos suplementares relacionados à sensibilidade\n\n' +
              ('\n'.join(f'- `{p}`' for p in candidatos) if candidatos else '- Nenhum candidato localizado automaticamente.') +
              '\n\n## Regra de referências\n\nTodas as chaves bibliográficas presentes antes da revisão permanecem citadas após a consolidação.\n',
              encoding='utf-8'
          )
          print(rel.read_text(encoding='utf-8'))
          PY

      - name: Registrar revisão editorial
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latex-artigo/sections/03_metodologia.tex latex-artigo/sections/08_matriz.tex latex-artigo/suplemento/material_suplementar.tex docs/REVISAO_EDITORIAL_ENXUTA_2026-07-14.md
          git commit -m "Consolida metodologia e preserva tabelas suplementares"
          git push origin agent/revisao-editorial-enxuta
