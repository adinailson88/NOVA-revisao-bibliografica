name: Revisão editorial temporária

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/revisao-editorial-enxuta]
    paths:
      - .github/workflows/revisao_editorial_temp.yml

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch editorial
        uses: actions/checkout@v4
        with:
          ref: agent/revisao-editorial-enxuta
          fetch-depth: 0

      - name: Instalar dependências do verificador
        run: python -m pip install --disable-pip-version-check pandas numpy matplotlib scikit-learn openpyxl

      - name: Executar verificador e registrar diagnóstico
        run: |
          set +e
          python scripts/python/gerar_produtos_artigo_nucleo_ampliado.py > /tmp/preparo.log 2>&1
          python scripts/python/11_gerar_bibliometria_ampliada.py >> /tmp/preparo.log 2>&1
          python scripts/python/12_gerar_lista_referencias.py >> /tmp/preparo.log 2>&1
          python scripts/python/14_gerar_planilhas_auditoria_referencias.py >> /tmp/preparo.log 2>&1
          python scripts/python/verificar_artigo_integrado.py > docs/DIAGNOSTICO_VERIFICADOR_EDITORIAL.txt 2>&1
          codigo=$?
          cat docs/DIAGNOSTICO_VERIFICADOR_EDITORIAL.txt
          echo "codigo_saida=$codigo" >> docs/DIAGNOSTICO_VERIFICADOR_EDITORIAL.txt
          exit 0

      - name: Registrar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIAGNOSTICO_VERIFICADOR_EDITORIAL.txt
          if git diff --cached --quiet; then
            echo "Diagnóstico inalterado."
          else
            git commit -m "Atualiza diagnóstico do verificador editorial"
            git push origin agent/revisao-editorial-enxuta
          fi
