name: Revisão editorial temporária

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/revisao-editorial-enxuta]
    paths:
      - .github/workflows/revisao_editorial_temp.yml

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch editorial
        uses: actions/checkout@v4
        with:
          ref: agent/revisao-editorial-enxuta
          fetch-depth: 0

      - name: Atualizar testes para a redação consolidada
        run: python scripts/python/17_atualizar_verificador_editorial.py

      - name: Registrar verificador atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/python/verificar_artigo_integrado.py
          if git diff --cached --quiet; then
            echo "Verificador já atualizado."
          else
            git commit -m "Atualiza verificador para revisão editorial enxuta"
            git push origin agent/revisao-editorial-enxuta
          fi
