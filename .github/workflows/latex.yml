name: Compilar LaTeX

on:
  push:
    paths:
      - "latex-artigo/**"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese texlive-bibtex-extra texlive-pictures

      - name: Compilar PDF
        working-directory: latex-artigo
        run: latexmk -pdf -bibtex -interaction=nonstopmode -halt-on-error main.tex

      - name: Publicar PDF no repositorio (raiz, link do README)
        run: |
          cp latex-artigo/main.pdf main.pdf
          if git diff --quiet -- main.pdf; then
            echo "PDF inalterado; nada a commitar."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add main.pdf
            git commit -m "CI: recompila PDF do artigo [skip ci]"
            git push
          fi

      - name: Publicar PDF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: artigo-pdf
          path: main.pdf
          if-no-files-found: error
