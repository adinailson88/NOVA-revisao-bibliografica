name: Validar fontes e gerar artigo

# Em branches e pull requests, valida apenas fontes e produtos reprodutiveis em Python.
# PDF e Word sao regenerados somente por execucao manual ou por push na main.

on:
  push:
    paths:
      - "latex-artigo/**"
      - "03_PROCESSADOS/corpus_consolidado_v2_sensibilidade.csv"
      - "07_SINTESE_TEMATICA/nucleo_final_pos_auditoria_resumos.csv"
      - "07_SINTESE_TEMATICA/matriz_extracao_final_reavaliada_resumos.csv"
      - "scripts/python/gerar_produtos_artigo_nucleo_ampliado.py"
      - "scripts/python/verificar_artigo.py"
      - "scripts/python/11_gerar_bibliometria_ampliada.py"
      - "scripts/python/12_gerar_lista_referencias.py"
      - "scripts/python/13_preparar_word.py"
      - "scripts/python/14_gerar_planilhas_auditoria_referencias.py"
      - "README.md"
      - "referencias/**"
      - "site/**"
      - ".github/workflows/latex.yml"
  pull_request:
    paths:
      - "latex-artigo/**"
      - "03_PROCESSADOS/corpus_consolidado_v2_sensibilidade.csv"
      - "07_SINTESE_TEMATICA/nucleo_final_pos_auditoria_resumos.csv"
      - "07_SINTESE_TEMATICA/matriz_extracao_final_reavaliada_resumos.csv"
      - "scripts/python/gerar_produtos_artigo_nucleo_ampliado.py"
      - "scripts/python/verificar_artigo.py"
      - "scripts/python/11_gerar_bibliometria_ampliada.py"
      - "scripts/python/12_gerar_lista_referencias.py"
      - "scripts/python/13_preparar_word.py"
      - "scripts/python/14_gerar_planilhas_auditoria_referencias.py"
      - "README.md"
      - "referencias/**"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: artigo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Instalar dependencias Python
        run: python -m pip install --disable-pip-version-check pandas numpy matplotlib scikit-learn openpyxl

      - name: Gerar tabelas e graficos do nucleo vigente
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python scripts/python/gerar_produtos_artigo_nucleo_ampliado.py

      - name: Gerar camada bibliometrica ampliada
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python scripts/python/11_gerar_bibliometria_ampliada.py

      - name: Gerar inventario auditavel das referencias
        run: python scripts/python/12_gerar_lista_referencias.py

      - name: Gerar planilhas dos nucleos vigente e historico
        run: python scripts/python/14_gerar_planilhas_auditoria_referencias.py

      - name: Verificar dados, texto e referencias
        run: python scripts/python/verificar_artigo.py

      - name: Instalar TeX Live
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese texlive-bibtex-extra texlive-pictures poppler-utils

      - name: Compilar PDF
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        working-directory: latex-artigo
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Instalar Pandoc e gerador do Word
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          sudo apt-get install -y pandoc
          python -m pip install --disable-pip-version-check python-docx

      - name: Gerar e validar versao Word
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          python scripts/python/13_preparar_word.py
          test -s artigo.docx
          unzip -t artigo.docx
          unzip -l artigo.docx | grep -q "word/document.xml"

      - name: Verificar margens do PDF
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          log = Path("latex-artigo/main.log").read_text(encoding="utf-8", errors="ignore")
          excessos = [float(x) for x in re.findall(r"Overfull \\hbox \(([0-9.]+)pt too wide\)", log)]
          if excessos:
              raise SystemExit(f"Conteudo ultrapassando a margem: maximo de {max(excessos):.2f} pt")
          print("Nenhum Overfull hbox detectado.")
          PY

      - name: Preparar PDF compilado e site
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          cp latex-artigo/main.pdf main.pdf
          mkdir -p site
          cp main.pdf site/artigo.pdf

      - name: Publicar produtos da compilacao completa
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A latex-artigo/figuras latex-artigo/fontes docs/RELATORIO_BIBLIOMETRIA_372.md referencias artigo.docx main.pdf site/artigo.pdf
          if git diff --cached --quiet; then
            echo "Produtos inalterados."
          else
            git commit -m "CI: atualiza produtos do nucleo vigente, PDF e Word [skip ci]"
            git push
          fi

      - name: Publicar produtos como artefato
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: artigo-pdf-word-referencias
          path: |
            main.pdf
            artigo.docx
            referencias
            latex-artigo/figuras
            latex-artigo/fontes
          if-no-files-found: error

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site com o PDF compilado
        run: |
          mkdir -p site
          cp main.pdf site/artigo.pdf

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
