name: Gerar tabelas, graficos e PDF

# Validacao controlada do artigo e dos produtos derivados.

on:
  push:
    paths:
      - "latex-artigo/**"
      - "scripts/r/10_gerar_produtos_artigo.R"
      - "scripts/python/verificar_artigo.py"
      - ".github/workflows/latex.yml"
  pull_request:
    paths:
      - "latex-artigo/**"
      - "scripts/r/10_gerar_produtos_artigo.R"
      - "scripts/python/verificar_artigo.py"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: artigo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Instalar pacotes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::ggplot2
            any::scales

      - name: Gerar tabelas e graficos
        run: |
          rm -f latex-artigo/figuras/figura10_distribuicao_base_tipo_nucleo_final_104.png
          Rscript scripts/r/10_gerar_produtos_artigo.R

      - name: Verificar dados, texto e referencias
        run: python scripts/python/verificar_artigo.py

      - name: Instalar TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese texlive-bibtex-extra texlive-pictures

      - name: Compilar PDF
        working-directory: latex-artigo
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Verificar margens do PDF
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          log = Path("latex-artigo/main.log").read_text(encoding="utf-8", errors="ignore")
          excessos = [float(x) for x in re.findall(r"Overfull \\hbox \(([0-9.]+)pt too wide\)", log)]
          if excessos:
              raise SystemExit(f"Conteudo ultrapassando a margem: maximo de {max(excessos):.2f} pt")
          print("Nenhum Overfull hbox detectado.")
          PY

      - name: Preparar PDF compilado
        run: cp latex-artigo/main.pdf main.pdf

      - name: Publicar PDF e produtos gerados
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A latex-artigo/figuras latex-artigo/fontes main.pdf
          if git diff --cached --quiet; then
            echo "Produtos inalterados."
          else
            git commit -m "CI: atualiza tabelas, graficos e PDF [skip ci]"
            git push
          fi

      - name: Publicar PDF como artefato
        uses: actions/upload-artifact@v4
        with:
          name: artigo-pdf
          path: |
            main.pdf
            latex-artigo/figuras
            latex-artigo/fontes
          if-no-files-found: error

      - name: Montar site do GitHub Pages
        if: github.event_name == 'push'
        run: |
          mkdir -p site
          cp main.pdf site/main.pdf
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <title>Manutencao predial sustentavel em edificacoes publicas universitarias</title>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #525659; }
              header { padding: 0.6rem 1rem; background: #2c2c2c; color: #eee; font-size: 0.95rem; }
              header a { color: #9ecbff; }
              iframe { width: 100%; height: calc(100% - 44px); border: none; display: block; }
            </style>
          </head>
          <body>
            <header>
              Manutencao predial sustentavel em edificacoes publicas universitarias &mdash;
              <a href="main.pdf">abrir/baixar PDF</a>
            </header>
            <iframe src="main.pdf"></iframe>
          </body>
          </html>
          HTML

      - name: Publicar artefato do GitHub Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
