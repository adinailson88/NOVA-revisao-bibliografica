name: Gerar tabelas, graficos, PDF e Word

# Validacao controlada do artigo e dos produtos derivados.

on:
  push:
    paths:
      - "latex-artigo/**"
      - "scripts/r/10_gerar_produtos_artigo.R"
      - "scripts/python/verificar_artigo.py"
      - "scripts/python/11_gerar_bibliometria_ampliada.py"
      - "scripts/python/12_gerar_lista_referencias.py"
      - "scripts/python/13_preparar_word.py"
      - "README.md"
      - "referencias/**"
      - "site/**"
      - ".github/workflows/latex.yml"
  pull_request:
    paths:
      - "latex-artigo/**"
      - "scripts/r/10_gerar_produtos_artigo.R"
      - "scripts/python/verificar_artigo.py"
      - "scripts/python/11_gerar_bibliometria_ampliada.py"
      - "scripts/python/12_gerar_lista_referencias.py"
      - "README.md"
      - "referencias/**"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: artigo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Instalar pacotes R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::dplyr
            any::tidyr
            any::stringr
            any::ggplot2
            any::scales

      - name: Gerar tabelas e graficos
        run: |
          rm -f latex-artigo/figuras/figura10_distribuicao_base_tipo_nucleo_final_104.png
          Rscript scripts/r/10_gerar_produtos_artigo.R

      - name: Instalar dependencias da bibliometria
        run: python -m pip install --disable-pip-version-check pandas numpy matplotlib scikit-learn

      - name: Gerar camada bibliometrica ampliada
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python scripts/python/11_gerar_bibliometria_ampliada.py

      - name: Gerar inventario auditavel das referencias
        run: python scripts/python/12_gerar_lista_referencias.py

      - name: Verificar dados, texto e referencias
        run: python scripts/python/verificar_artigo.py

      - name: Instalar TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese texlive-bibtex-extra texlive-pictures

      - name: Compilar PDF
        working-directory: latex-artigo
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Instalar conversor para Word
        run: python -m pip install --disable-pip-version-check pdf2docx

      - name: Gerar e validar versao Word
        run: |
          python scripts/python/13_preparar_word.py
          test -s artigo.docx
          unzip -t artigo.docx
          unzip -l artigo.docx | grep -q "word/document.xml"

      - name: Verificar margens do PDF
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          log = Path("latex-artigo/main.log").read_text(encoding="utf-8", errors="ignore")
          excessos = [float(x) for x in re.findall(r"Overfull \\hbox \(([0-9.]+)pt too wide\)", log)]
          if excessos:
              raise SystemExit(f"Conteudo ultrapassando a margem: maximo de {max(excessos):.2f} pt")
          print("Nenhum Overfull hbox detectado.")
          PY

      - name: Preparar PDF compilado e site
        run: |
          cp latex-artigo/main.pdf main.pdf
          mkdir -p site
          cp main.pdf site/artigo.pdf

      - name: Publicar PDF e produtos gerados
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A latex-artigo/figuras latex-artigo/fontes docs/RELATORIO_BIBLIOMETRIA_372.md referencias artigo.docx main.pdf
          if git diff --cached --quiet; then
            echo "Produtos inalterados."
          else
            git commit -m "CI: atualiza tabelas, graficos, PDF e Word [skip ci]"
            git push
          fi

      - name: Publicar PDF como artefato
        uses: actions/upload-artifact@v4
        with:
          name: artigo-pdf-word-referencias
          path: |
            main.pdf
            artigo.docx
            referencias
            latex-artigo/figuras
            latex-artigo/fontes
          if-no-files-found: error


  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar site com o PDF compilado
        run: |
          mkdir -p site
          cp main.pdf site/artigo.pdf

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
