name: Validar fontes e gerar artigo

on:
  push:
    paths: ["01_PROTOCOLO/**", "latex-artigo/**", "03_PROCESSADOS/corpus_consolidado_v2_sensibilidade.csv", "07_SINTESE_TEMATICA/**", "scripts/python/**", "README.md", "referencias/**", "site/**", ".github/workflows/latex.yml"]
  pull_request:
    paths: ["01_PROTOCOLO/**", "latex-artigo/**", "03_PROCESSADOS/corpus_consolidado_v2_sensibilidade.csv", "07_SINTESE_TEMATICA/**", "scripts/python/**", "README.md", "referencias/**", ".github/workflows/latex.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: artigo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Instalar dependencias Python
        run: python -m pip install --disable-pip-version-check pandas numpy matplotlib scikit-learn openpyxl python-docx

      - name: Gerar tabelas e graficos do nucleo vigente
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python scripts/python/gerar_produtos_artigo_nucleo_ampliado.py

      - name: Gerar camada bibliometrica ampliada
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python scripts/python/11_gerar_bibliometria_ampliada.py

      - name: Gerar inventario auditavel das referencias
        run: python scripts/python/12_gerar_lista_referencias.py

      - name: Gerar planilhas dos nucleos vigente e historico
        run: python scripts/python/14_gerar_planilhas_auditoria_referencias.py

      - name: Verificar dados, texto, referencias e strings da sensibilidade
        run: python scripts/python/verificar_artigo_integrado.py

      - name: Instalar TeX Live
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese texlive-bibtex-extra texlive-pictures poppler-utils

      - name: Compilar PDF
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        working-directory: latex-artigo
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Compilar PDF anonimizado
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        working-directory: latex-artigo
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main_anonimo.tex

      - name: Compilar material suplementar
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        working-directory: latex-artigo/suplemento
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main_suplementar.tex

      - name: Instalar Pandoc e LibreOffice
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: sudo apt-get install -y pandoc libreoffice-writer

      - name: Gerar e validar versao Word
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          python scripts/python/13_preparar_word.py
          test -s artigo.docx
          unzip -t artigo.docx
          unzip -l artigo.docx | grep -q "word/document.xml"
          mkdir -p /tmp/word_check
          libreoffice --headless --convert-to pdf --outdir /tmp/word_check artigo.docx
          test -s /tmp/word_check/artigo.pdf
          python scripts/python/verificar_artigo_word.py artigo.docx

      - name: Gerar e validar versao Word anonimizada
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          python scripts/python/anonimizar_docx.py artigo.docx artigo_anonimo.docx
          test -s artigo_anonimo.docx
          unzip -t artigo_anonimo.docx
          unzip -l artigo_anonimo.docx | grep -q "word/document.xml"

      - name: Verificar margens do PDF
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path("latex-artigo/main.log").read_text(encoding="utf-8", errors="ignore")
          excessos = [float(x) for x in re.findall(r"Overfull \\hbox \(([0-9.]+)pt too wide\)", log)]
          if excessos:
              raise SystemExit(f"Conteudo ultrapassando a margem: maximo de {max(excessos):.2f} pt")
          print("Nenhum Overfull hbox detectado.")
          PY

      - name: Preparar arquivos para download
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          cp latex-artigo/main.pdf main.pdf
          cp latex-artigo/main_anonimo.pdf main_anonimo.pdf
          cp latex-artigo/suplemento/main_suplementar.pdf material_suplementar.pdf
          mkdir -p site
          cp main.pdf site/artigo.pdf
          cp artigo.docx site/artigo.docx
          test -s site/artigo.pdf
          test -s site/artigo.docx

      - name: Publicar produtos da compilacao completa
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A latex-artigo/figuras latex-artigo/fontes docs/RELATORIO_BIBLIOMETRIA_372.md referencias artigo.docx artigo_anonimo.docx main.pdf main_anonimo.pdf material_suplementar.pdf site/artigo.pdf site/artigo.docx
          if git diff --cached --quiet; then
            echo "Produtos inalterados."
          else
            git commit -m "CI: atualiza PDF e Word validados para download [skip ci]"
            git push
          fi

      - name: Publicar produtos como artefato
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: artigo-pdf-word-referencias
          path: |
            main.pdf
            main_anonimo.pdf
            material_suplementar.pdf
            artigo.docx
            artigo_anonimo.docx
            referencias
            latex-artigo/figuras
            latex-artigo/fontes
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Preparar site com PDF e Word
        run: |
          mkdir -p site
          cp main.pdf site/artigo.pdf
          cp artigo.docx site/artigo.docx
          test -s site/artigo.pdf
          test -s site/artigo.docx
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
