name: Gerar tabelas, graficos e PDF

on:
  push:
    paths:
      - "latex-artigo/**"
      - "scripts/r/10_gerar_produtos_artigo.R"
      - "scripts/python/verificar_artigo.py"
      - ".github/workflows/latex.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: artigo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Instalar pacotes R
        shell: Rscript {0}
        run: |
          install.packages(
            c("readr", "dplyr", "tidyr", "stringr", "ggplot2", "scales"),
            repos = "https://cloud.r-project.org"
          )

      - name: Gerar tabelas e graficos
        run: |
          rm -f latex-artigo/figuras/figura10_distribuicao_base_tipo_nucleo_final_104.png
          Rscript scripts/r/10_gerar_produtos_artigo.R

      - name: Verificar dados, texto e referencias
        run: python scripts/python/verificar_artigo.py

      - name: Instalar TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese texlive-bibtex-extra texlive-pictures

      - name: Compilar PDF
        working-directory: latex-artigo
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Verificar margens do PDF
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          log = Path("latex-artigo/main.log").read_text(encoding="utf-8", errors="ignore")
          excessos = [float(x) for x in re.findall(r"Overfull \\hbox \(([0-9.]+)pt too wide\)", log)]
          if excessos:
              raise SystemExit(f"Conteudo ultrapassando a margem: maximo de {max(excessos):.2f} pt")
          print("Nenhum Overfull hbox detectado.")
          PY

      - name: Publicar PDF e produtos gerados
        run: |
          cp latex-artigo/main.pdf main.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A latex-artigo/figuras latex-artigo/fontes main.pdf
          if git diff --cached --quiet; then
            echo "Produtos inalterados."
          else
            git commit -m "CI: atualiza tabelas, graficos e PDF [skip ci]"
            git push
          fi

      - name: Publicar PDF como artefato
        uses: actions/upload-artifact@v4
        with:
          name: artigo-pdf
          path: main.pdf
          if-no-files-found: error
