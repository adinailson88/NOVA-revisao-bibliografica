name: Exportar PDF final para inspeção

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/latex.yml"]

permissions:
  contents: read

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch temporária
        uses: actions/checkout@v4
        with:
          ref: agent/validacao-visual-20260714

      - name: Confirmar PDF final
        run: test -s main.pdf

      - name: Publicar apenas o PDF final
        uses: actions/upload-artifact@v4
        with:
          name: pdf-final-validacao-visual
          path: main.pdf
          if-no-files-found: error
