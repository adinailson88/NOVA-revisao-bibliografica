name: Diagnosticar verificador do artigo

on:
  push:
    paths: [".github/workflows/latex.yml"]
  pull_request:
    paths: [".github/workflows/latex.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
      - name: Executar verificador e registrar saída
        id: verificar
        continue-on-error: true
        run: python scripts/python/verificar_artigo_integrado.py > docs/DIAGNOSTICO_VERIFICADOR.txt 2>&1
      - name: Publicar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DIAGNOSTICO_VERIFICADOR.txt
          git commit -m "CI: registra diagnóstico do verificador [skip ci]" || true
          git push
      - name: Encerrar conforme resultado
        run: |
          cat docs/DIAGNOSTICO_VERIFICADOR.txt
          test "${{ steps.verificar.outcome }}" = "success"