name: Validar revisão do parecer

on:
  push:
    branches:
      - agent/revisao-parecer-critico
    paths:
      - "latex-artigo/**"
      - "scripts/python/**"
      - ".github/workflows/validar-revisao-parecer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/revisao-parecer-critico

      - name: Instalar dependências Python
        run: |
          python -m pip install --disable-pip-version-check pandas numpy matplotlib scikit-learn openpyxl python-docx

      - name: Regenerar produtos
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          python scripts/python/gerar_produtos_artigo_nucleo_ampliado.py
          python scripts/python/11_gerar_bibliometria_ampliada.py
          python scripts/python/12_gerar_lista_referencias.py
          python scripts/python/14_gerar_planilhas_auditoria_referencias.py

      - name: Executar verificador e registrar diagnóstico
        id: verificar
        run: |
          set +e
          python scripts/python/verificar_artigo_integrado.py > docs/VALIDACAO_PARECER_LOG.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat docs/VALIDACAO_PARECER_LOG.txt
          exit 0

      - name: Salvar diagnóstico textual na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/VALIDACAO_PARECER_LOG.txt latex-artigo/fontes/intersecao_camadas_372_121.csv
          if git diff --cached --quiet; then
            echo "Diagnóstico textual inalterado."
          else
            git commit -m "Registra diagnóstico da revisão crítica [skip ci]"
            git push
          fi

      - name: Confirmar verificador
        run: test "${{ steps.verificar.outputs.status }}" -eq 0

      - name: Instalar compiladores
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese texlive-bibtex-extra texlive-pictures poppler-utils pandoc libreoffice-writer

      - name: Compilar e verificar PDF
        id: pdf
        run: |
          set +e
          : > docs/VALIDACAO_PRODUTOS_LOG.txt
          echo "VALIDAÇÃO DO PDF" >> docs/VALIDACAO_PRODUTOS_LOG.txt
          (cd latex-artigo && latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex) >> docs/VALIDACAO_PRODUTOS_LOG.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python - <<'PY' >> docs/VALIDACAO_PRODUTOS_LOG.txt 2>&1
          import re
          from pathlib import Path
          log = Path("latex-artigo/main.log").read_text(encoding="utf-8", errors="ignore")
          excessos = [float(x) for x in re.findall(r"Overfull \\hbox \\(([0-9.]+)pt too wide\\)", log)]
          if excessos:
              raise SystemExit(f"CONTEUDO_FORA_DA_MARGEM_PT={max(excessos):.2f}")
          pdf = Path("latex-artigo/main.pdf")
          if not pdf.exists() or pdf.stat().st_size == 0:
              raise SystemExit("PDF_AUSENTE_OU_VAZIO")
          print(f"PDF_BYTES={pdf.stat().st_size}")
          print("MARGENS=OK")
          PY
            status=$?
          fi
          if [ "$status" -eq 0 ]; then
            pdfinfo latex-artigo/main.pdf | grep -E "^(Pages|Page size):" >> docs/VALIDACAO_PRODUTOS_LOG.txt
          fi
          echo "PDF_STATUS=$status" >> docs/VALIDACAO_PRODUTOS_LOG.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat docs/VALIDACAO_PRODUTOS_LOG.txt
          exit 0

      - name: Gerar e validar Word
        id: word
        run: |
          set +e
          echo "VALIDAÇÃO DO WORD" >> docs/VALIDACAO_PRODUTOS_LOG.txt
          python scripts/python/13_preparar_word.py >> docs/VALIDACAO_PRODUTOS_LOG.txt 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then test -s artigo.docx; status=$?; fi
          if [ "$status" -eq 0 ]; then unzip -t artigo.docx >> docs/VALIDACAO_PRODUTOS_LOG.txt 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then unzip -l artigo.docx | grep -q "word/document.xml"; status=$?; fi
          if [ "$status" -eq 0 ]; then
            mkdir -p /tmp/word_check
            libreoffice --headless --convert-to pdf --outdir /tmp/word_check artigo.docx >> docs/VALIDACAO_PRODUTOS_LOG.txt 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then test -s /tmp/word_check/artigo.pdf; status=$?; fi
          if [ "$status" -eq 0 ]; then
            stat -c "WORD_BYTES=%s" artigo.docx >> docs/VALIDACAO_PRODUTOS_LOG.txt
            pdfinfo /tmp/word_check/artigo.pdf | grep -E "^(Pages|Page size):" >> docs/VALIDACAO_PRODUTOS_LOG.txt
            echo "OOXML=OK" >> docs/VALIDACAO_PRODUTOS_LOG.txt
            echo "LIBREOFFICE_RECONVERSAO=OK" >> docs/VALIDACAO_PRODUTOS_LOG.txt
          fi
          echo "WORD_STATUS=$status" >> docs/VALIDACAO_PRODUTOS_LOG.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat docs/VALIDACAO_PRODUTOS_LOG.txt
          exit 0

      - name: Salvar validação dos produtos na branch
        run: |
          git add docs/VALIDACAO_PRODUTOS_LOG.txt
          if git diff --cached --quiet; then
            echo "Validação dos produtos inalterada."
          else
            git commit -m "Registra validação do PDF e Word [skip ci]"
            git push
          fi

      - name: Confirmar PDF e Word
        run: |
          test "${{ steps.pdf.outputs.status }}" -eq 0
          test "${{ steps.word.outputs.status }}" -eq 0

      - name: Publicar artefatos de validação
        uses: actions/upload-artifact@v4
        with:
          name: revisao-parecer-pdf-word
          path: |
            latex-artigo/main.pdf
            artigo.docx
          if-no-files-found: error
