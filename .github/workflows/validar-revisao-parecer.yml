name: Validar revisão do parecer

on:
  push:
    branches:
      - agent/revisao-parecer-critico
    paths:
      - "latex-artigo/**"
      - "scripts/python/**"
      - ".github/workflows/validar-revisao-parecer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/revisao-parecer-critico

      - name: Instalar dependências Python
        run: |
          python -m pip install --disable-pip-version-check pandas numpy matplotlib scikit-learn openpyxl python-docx

      - name: Regenerar produtos e verificar artigo
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          python scripts/python/gerar_produtos_artigo_nucleo_ampliado.py
          python scripts/python/11_gerar_bibliometria_ampliada.py
          python scripts/python/12_gerar_lista_referencias.py
          python scripts/python/14_gerar_planilhas_auditoria_referencias.py
          python scripts/python/verificar_artigo_integrado.py

      - name: Instalar compiladores
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk biber texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-lang-portuguese texlive-bibtex-extra texlive-pictures poppler-utils pandoc libreoffice-writer

      - name: Compilar PDF
        working-directory: latex-artigo
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Verificar margens e páginas do PDF
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path("latex-artigo/main.log").read_text(encoding="utf-8", errors="ignore")
          excessos = [float(x) for x in re.findall(r"Overfull \\hbox \\(([0-9.]+)pt too wide\\)", log)]
          if excessos:
              raise SystemExit(f"Conteúdo ultrapassando a margem: máximo de {max(excessos):.2f} pt")
          pdf = Path("latex-artigo/main.pdf")
          if not pdf.exists() or pdf.stat().st_size == 0:
              raise SystemExit("PDF não foi gerado.")
          print(f"PDF válido: {pdf.stat().st_size} bytes")
          PY
          pdfinfo latex-artigo/main.pdf | grep -E "^(Pages|Page size):"

      - name: Gerar e validar Word
        run: |
          python scripts/python/13_preparar_word.py
          test -s artigo.docx
          unzip -t artigo.docx
          unzip -l artigo.docx | grep -q "word/document.xml"
          mkdir -p /tmp/word_check
          libreoffice --headless --convert-to pdf --outdir /tmp/word_check artigo.docx
          test -s /tmp/word_check/artigo.pdf
          pdfinfo /tmp/word_check/artigo.pdf | grep -E "^(Pages|Page size):"

      - name: Publicar artefatos de validação
        uses: actions/upload-artifact@v4
        with:
          name: revisao-parecer-pdf-word
          path: |
            latex-artigo/main.pdf
            artigo.docx
          if-no-files-found: error
