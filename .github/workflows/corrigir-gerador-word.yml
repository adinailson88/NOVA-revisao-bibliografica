name: Corrigir gerador Word

on:
  push:
    branches:
      - agent/revisao-parecer-critico
    paths:
      - ".github/workflows/corrigir-gerador-word.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revisao-parecer-critico

      - name: Restaurar escapes dos comandos LaTeX
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          caminho = Path("scripts/python/13_preparar_word.py")
          linhas = caminho.read_text(encoding="utf-8").splitlines()
          bs = chr(92)

          indice_label = next(
              i for i, linha in enumerate(linhas)
              if "for tipo, rotulo in re.findall" in linha
          )
          linhas[indice_label] = (
              f'        for tipo, rotulo in re.findall(r"{bs}{bs}label{bs}{{(tab|fig):([^}}]+){bs}}}", conteudo):'
          )

          inicio_tikz = next(i for i, linha in enumerate(linhas) if linha.startswith("def inserir_figuras_tikz"))
          indice_figura = next(
              i for i in range(inicio_tikz, len(linhas))
              if linhas[i].lstrip().startswith('r"') and "tikzpicture" in linhas[i]
          )
          linhas[indice_figura] = (
              f'        r"{bs}{bs}begin{bs}{{figure{bs}}}.*?({bs}{bs}begin{bs}{{tikzpicture{bs}}}.*?'
              f'{bs}{bs}end{bs}{{tikzpicture{bs}}}).*?{bs}{bs}caption{bs}{{([^{{}}]+){bs}}}",'
          )

          caminho.write_text("\n".join(linhas) + "\n", encoding="utf-8")
          fonte = caminho.read_text(encoding="utf-8")
          compile(fonte, str(caminho), "exec")
          re.compile(r"\\label\{(tab|fig):([^}]+)\}")
          re.compile(r"\\begin\{figure\}.*?(\\begin\{tikzpicture\}.*?\\end\{tikzpicture\}).*?\\caption\{([^{}]+)\}", re.DOTALL)
          print("Escapes LaTeX restaurados e expressões regulares válidas.")
          PY

      - name: Registrar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/python/13_preparar_word.py
          git commit -m "Restaura escapes LaTeX no gerador Word [skip ci]"
          git push
