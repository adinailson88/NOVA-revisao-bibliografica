name: Corrigir margem do glossário

on:
  push:
    branches:
      - agent/revisao-parecer-critico
    paths:
      - ".github/workflows/corrigir-margem-glossario.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revisao-parecer-critico

      - name: Ajustar larguras da tabela-glossário
        run: |
          python - <<'PY'
          from pathlib import Path

          caminho = Path("latex-artigo/sections/03_metodologia.tex")
          texto = caminho.read_text(encoding="utf-8")
          bs = chr(92)
          antigo = f'p{{3.4cm}} >{{{bs}raggedleft{bs}arraybackslash}}p{{1.5cm}} Y'
          novo = f'p{{3.3cm}} >{{{bs}raggedleft{bs}arraybackslash}}p{{1.6cm}} Y'
          if texto.count(antigo) != 1:
              raise SystemExit(f"Padrão esperado não localizado exatamente uma vez: {texto.count(antigo)}")
          caminho.write_text(texto.replace(antigo, novo, 1), encoding="utf-8")
          print("Colunas ajustadas sem alterar a largura total da tabela.")
          PY

      - name: Registrar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latex-artigo/sections/03_metodologia.tex
          git commit -m "Corrige margem da tabela-glossário [skip ci]"
          git push
