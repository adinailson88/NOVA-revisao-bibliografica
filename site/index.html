<!doctype html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manutenção predial sustentável - artigo</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #eef2f6; color: #172033; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 1.2rem; background: #fff; border-bottom: 1px solid #d8dee8; }
    h1 { margin: 0; font-size: 1rem; font-weight: 650; }
    nav { display: flex; gap: .65rem; }
    a { color: #fff; background: #185fa5; border-radius: .45rem; padding: .55rem .8rem; text-decoration: none; font-size: .88rem; }
    iframe { display: block; width: 100%; height: calc(100vh - 64px); border: 0; background: #fff; }
    @media (max-width: 700px) { header { align-items: flex-start; flex-direction: column; } iframe { height: calc(100vh - 104px); } }
  </style>
</head>
<body>
  <header>
    <h1>Manutenção predial sustentável em edificações públicas universitárias</h1>
    <nav>
      <a href="artigo.pdf" target="_blank" rel="noopener">Abrir PDF</a>
      <a href="https://github.com/adinailson88/NOVA-revisao-bibliografica">Dados e scripts</a>
    </nav>
  </header>
  <iframe src="artigo.pdf#view=FitH" title="Artigo científico em PDF"></iframe>

</html>
